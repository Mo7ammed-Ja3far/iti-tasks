{% extends 'base.html' %} {% block title %}Cancel Enrollment{% endblock %} {%block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4 border-0 shadow-sm text-center">
      <i class="bi bi-exclamation-triangle text-danger display-3 mb-2"></i>
      <h4 class="fw-bold">Cancel Enrollment?</h4>
      <p class="text-muted">
        Are you sure you want to cancel your enrollment in
        <strong>{{ enrollment.course.title }}</strong>?
      </p>
      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger w-100 mb-2">
          Yes, Cancel Enrollment
        </button>
        <a
          href="{% url 'accounts:profile' %}"
          class="btn btn-outline-secondary w-100"
          >Go Back</a
        >
      </form>
    </div>
  </div>
</div>
{% endblock %}
